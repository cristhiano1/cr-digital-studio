<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#05000C"/>
      <stop offset="0.5" stop-color="#020006"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="purpleGlow" cx="0" cy="630" r="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7B39FC" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#7B39FC" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyanGlow" cx="1200" cy="0" r="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#64CEFB" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#64CEFB" stop-opacity="0"/>
    </radialGradient>

    <!-- Text Gradients -->
    <linearGradient id="textGrad" x1="0" y1="0" x2="600" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#64CEFB"/>
      <stop offset="0.5" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#7B39FC"/>
    </linearGradient>

    <!-- Border Gradients -->
    <linearGradient id="cardBorder" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="0.5" stop-color="#7B39FC" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#64CEFB" stop-opacity="0.12"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Grid Lines -->
  <path d="M 0 70 L 1200 70 M 0 140 L 1200 140 M 0 210 L 1200 210 M 0 280 L 1200 280 M 0 350 L 1200 350 M 0 421 L 1200 421 M 0 490 L 1200 490 M 0 560 L 1200 560" stroke="#ffffff" stroke-opacity="0.015" stroke-width="1"/>
  <path d="M 120 0 L 120 630 M 240 0 L 240 630 M 360 0 L 360 630 M 480 0 L 480 630 M 600 0 L 600 630 M 720 0 L 720 630 M 840 0 L 840 630 M 960 0 L 960 630 M 1080 0 L 1080 630" stroke="#ffffff" stroke-opacity="0.015" stroke-width="1"/>

  <!-- Ambient Glows -->
  <rect width="1200" height="630" fill="url(#purpleGlow)"/>
  <rect width="1200" height="630" fill="url(#cyanGlow)"/>

  <!-- Card Border Outer Outline (Premium feel) -->
  <rect x="25" y="25" width="1150" height="580" rx="24" stroke="url(#cardBorder)" stroke-width="1.5" fill="none"/>

  <!-- Brand Header: Logo + Name -->
  <g transform="translate(80, 80)">
    <!-- Logo Circle Icon -->
    <circle cx="20" cy="20" r="18" stroke="#ffffff" stroke-opacity="0.6" stroke-width="2.5" fill="none"/>
    <circle cx="20" cy="20" r="6" fill="#ffffff"/>
    
    <!-- Text -->
    <text x="56" y="28" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="24" font-weight="700" fill="#ffffff" letter-spacing="0.5">CR Digital Systems</text>
  </g>

  <!-- Main Headline (Center-left) -->
  <g transform="translate(80, 220)">
    <!-- Main Headline Row 1 -->
    <text x="0" y="50" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="64" font-weight="900" fill="#ffffff" letter-spacing="-1.5">Turn Manual Work</text>
    
    <!-- Main Headline Row 2 (Gradient Text) -->
    <text x="0" y="130" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="64" font-weight="900" fill="url(#textGrad)" letter-spacing="-1.5">Into Web Systems.</text>
  </g>

  <!-- Subtitle / Positioning Tagline -->
  <g transform="translate(80, 480)">
    <!-- Decorative Line -->
    <line x1="0" y1="12" x2="30" y2="12" stroke="#ffffff" stroke-opacity="0.4" stroke-width="2"/>
    
    <!-- Tagline Text -->
    <text x="45" y="20" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#ffffff" fill-opacity="0.5" letter-spacing="3" text-transform="uppercase">Websites and systems built to move business forward.</text>
  </g>

  <!-- Decorative Orbitals (Visual balance on the right) -->
  <g transform="translate(900, 315)">
    <!-- Rings -->
    <circle cx="100" cy="0" r="160" stroke="#7B39FC" stroke-opacity="0.1" stroke-width="1.5" fill="none"/>
    <circle cx="100" cy="0" r="100" stroke="#64CEFB" stroke-opacity="0.08" stroke-width="1" fill="none"/>
    <circle cx="100" cy="0" r="50" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1" fill="none"/>

    <!-- Nodes -->
    <circle cx="100" cy="-100" r="4" fill="#64CEFB"/>
    <circle cx="-60" cy="0" r="3" fill="#7B39FC"/>
    <circle cx="200" cy="0" r="5" fill="#64CEFB"/>
  </g>
</svg>
